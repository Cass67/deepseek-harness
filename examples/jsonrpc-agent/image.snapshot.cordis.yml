# Image-capable keyless replay composition for SDK attachment snapshots.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.snapshot.yml
    patches:
      - id: llm-replay
        name: '@deepseek-ai/dsh-llm-replay'
        config:
          providers:
            - id: deepseek-official
              name: DeepSeek
              models:
                - id: deepseek-v4-flash
                  inputModalities: [text, image]
